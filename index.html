<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFF5F6" />
    <script>
      // Aplica o tema antes da primeira pintura para evitar "flash" de cor errada.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('zuzu-theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#191518');
        }
      })();
    </script>
    <meta
      name="description"
      content="Zuzu Zero reúne receitas e dicas para uma alimentação sem açúcar."
    />
    <meta property="og:title" content="Zuzu Zero" />
    <meta property="og:description" content="Receitas e guia de alimentação zero açúcar." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1490645935967-10de6ba17061?auto=format&fit=crop&w=1200&q=80" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Zuzu Zero | Receitas sem açúcar</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
